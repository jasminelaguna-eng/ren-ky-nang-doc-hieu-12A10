<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><title>Reading Block 3 Gia Viễn B</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Bố cục: header → taskbar 10 Unit + menu Test/Practice → thanh công cụ dính (chế độ, đồng hồ, nút) → 2 cột (bài đọc trái / câu hỏi phải), xếp chồng dưới 920px */
:root{
  --bg:#f2f5f3; --paper:#ffffff; --ink:#1b2620; --muted:#5a6a60; --line:#d3ddd6;
  --brand:#1f4e3d; --brand-ink:#f0f6f2; --accent:#2f7d5b; --accent-soft:#e1f0e7;
  --blank:#fff5d6; --blank-line:#b8901a;
  --ok:#1e8a4a; --ok-soft:#dcf2e3; --bad:#c43a30; --bad-soft:#fbe2df; --warn:#a86400; --warn-soft:#fdf0d9;
  --font: Arial,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --mono: Consolas,"SF Mono",Menlo,ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111814; --paper:#18221c; --ink:#e4ebe6; --muted:#9bb0a3; --line:#2d3c33;
  --brand:#0c1d15; --brand-ink:#e4ebe6; --accent:#6cc79a; --accent-soft:#1c3328;
  --blank:#332b12; --blank-line:#d8b54a;
  --ok:#5fd18e; --ok-soft:#153222; --bad:#ff7f73; --bad-soft:#3b1a17; --warn:#f0b450; --warn-soft:#3a2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111814; --paper:#18221c; --ink:#e4ebe6; --muted:#9bb0a3; --line:#2d3c33;
  --brand:#0c1d15; --brand-ink:#e4ebe6; --accent:#6cc79a; --accent-soft:#1c3328;
  --blank:#332b12; --blank-line:#d8b54a;
  --ok:#5fd18e; --ok-soft:#153222; --bad:#ff7f73; --bad-soft:#3b1a17; --warn:#f0b450; --warn-soft:#3a2c12; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{background:var(--brand);color:var(--brand-ink)}
header .wrap{padding-block:16px 14px;display:flex;flex-direction:column;gap:4px}
.hrow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px}
.school{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hright{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.stu{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.stu input{font:inherit;font-weight:600;font-size:14px;width:min(220px,52vw);padding:5px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:var(--brand-ink)}
.stu input::placeholder{color:var(--brand-ink);opacity:.65}
.stu input.need{outline:3px solid #ffd44d;outline-offset:1px}
.teacher{font-size:13px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:2px 12px}
h1{margin:0;font-size:clamp(17px,2.2vw,23px);line-height:1.3;font-weight:800;text-wrap:balance}

/* Taskbar */
.taskbar{background:var(--paper);border-bottom:1px solid var(--line)}
.taskbar .wrap{padding-block:10px;display:flex;flex-direction:column;gap:8px}
.unitbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ub{flex:none;font:inherit;font-size:13.5px;font-weight:700;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.ub .cnt{font-weight:600;font-size:11.5px;color:var(--muted);margin-left:4px}
.ub-p{border-color:var(--blank-line);color:var(--blank-line)} .ub.on{background:var(--accent);border-color:var(--accent);color:var(--paper)} .ub.on .cnt{color:var(--paper);opacity:.85}
.setrow{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.glbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tb{font:inherit;font-size:13.5px;font-weight:700;padding:6px 11px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.tb.none{border-style:dashed;color:var(--muted);font-weight:500}
.tb.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tb .sc{font-size:11px;font-weight:600;opacity:.75;margin-left:3px}

/* Thanh công cụ dính */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.sticky .wrap{padding-block:8px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 13px;background:var(--paper)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--paper)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.tbox{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.tlbl{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:700;color:var(--accent);min-width:5.2ch;text-align:center}
.timer.warn{color:var(--bad)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 13px}
button:hover:not(:disabled){border-color:var(--accent)}
button:focus-visible,.opt:focus-visible,summary:focus-visible,.gap:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:13px;color:var(--muted)}
.printmenu{position:relative}
.printmenu summary{list-style:none;cursor:pointer;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:8px 13px;background:var(--paper)}
.printmenu summary::-webkit-details-marker{display:none}
.printmenu .pm{position:absolute;right:0;top:calc(100% + 6px);z-index:8;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;display:grid;gap:4px;width:min(300px,86vw)}
.pm button{text-align:left;border:0;font-weight:600}
.pm button b{display:block}
.pm button span{font-size:12.5px;color:var(--muted);font-weight:500}

/* Tổng quan + tiến độ */
.bank{margin-top:14px;display:grid;gap:10px}
.bank details.box{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bank summary{cursor:pointer;font-weight:800;color:var(--accent)}
.gridwrap{overflow-x:auto;margin-top:10px}
table.grid{border-collapse:collapse;font-size:13px;min-width:560px;width:100%}
.grid th,.grid td{border:1px solid var(--line);padding:4px;text-align:center}
.grid th{background:var(--bg);font-weight:700;color:var(--muted);font-size:12px}
.grid th.u{text-align:left;padding-left:8px;white-space:nowrap;color:var(--ink)}
.cell{width:100%;padding:5px 0;border-radius:6px;font-size:12px;border:1px dashed var(--line);color:var(--muted);background:transparent;font-weight:600}
.cell.has{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
.cell.cur{outline:2px solid var(--blank-line);outline-offset:1px}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.kpis{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.kpi{background:var(--bg);border-radius:10px;padding:8px 14px;min-width:120px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:6px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
.tbl th{font-size:12px;color:var(--muted);font-weight:700}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tblwrap{overflow-x:auto}
.sub{font-size:13px;font-weight:800;margin:14px 0 2px}
.note{font-size:12.5px;color:var(--muted)}

/* 2 cột */
main.wrap{padding-block:16px 56px;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:920px){main.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;min-width:0}
@media (max-width:480px){.panel{padding:16px 14px}}
.passage{position:sticky;top:calc(var(--stick,64px) + 14px);max-height:calc(100vh - var(--stick,64px) - 30px);overflow:auto}
@media (max-width:920px){.passage{position:static;max-height:none}}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.passage h2{margin:4px 0 8px;font-size:20px;font-weight:800;text-wrap:balance}
.inst{font-size:14.5px;font-weight:700;margin:0 0 12px;line-height:1.5}
.ptext p{font-family:Arial,"Segoe UI",sans-serif;font-size:16px;line-height:1.75;margin:0 0 12px;text-align:justify;hyphens:auto}
.gap{display:inline;background:var(--blank);border:1.5px dashed var(--blank-line);border-radius:6px;padding:1px 6px;cursor:pointer;text-align:left}
.gap .n{font-family:var(--mono);font-weight:800;color:var(--blank-line);margin-right:4px;font-size:14px}
.gap .t{font-style:italic}
.gap.filled{border-style:solid;border-color:var(--accent);background:var(--accent-soft)} .gap.filled .n{color:var(--accent)}
.gap.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)} .gap.ok .n{color:var(--ok)}
.gap.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft)} .gap.bad .n{color:var(--bad)}
.wc,.mine{font-size:12.5px;color:var(--muted)}
.mine{margin-top:4px}
.modenote{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:7px 10px;margin:0 0 12px}
.modenote.retry{background:var(--warn-soft);color:var(--ink)}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px;font-size:13px;
